name: Crawl & Deploy

# 1) push 到 main 时构建并部署到 GitHub Pages
# 2) 每天定时重爬数据并重新部署（数据保鲜）
# 3) 可手动触发（Actions 页面 → Run workflow）

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *' # 每天 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 复用上次爬取的 README/package.json/图片缓存，增量更新
      - name: Restore crawler cache
        uses: actions/cache@v4
        with:
          path: |
            data/readmes
            data/package-jsons
            data/repos.json
            public/plugins
          key: dsh-crawl

      - name: Install dependencies
        run: npm ci

      # 爬取全部 dsh-plugin 仓库数据（Search API 用仓库自带的 GITHUB_TOKEN）
      - name: Crawl plugin data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/crawl.mjs

      - name: Build static site
        run: npm run build

      # 在 Action 内访问页面做冒烟测试：起本地静态服务器并检查首页与数据文件
      - name: Smoke test (serve & curl inside the Action)
        run: |
          npx vite preview --port 4173 &
          sleep 4
          curl -fsS -o /dev/null -w "index: %{http_code}\n" http://localhost:4173/
          curl -fsS -o /dev/null -w "data:  %{http_code}\n" http://localhost:4173/data/plugins.json
          curl -fsS -o /dev/null -w "favicon: %{http_code}\n" http://localhost:4173/favicon.svg
          echo "smoke test OK"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
